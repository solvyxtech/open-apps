slug: top-flutter-apps
kind: curated
title: Top Open Source Flutter Apps
description: Mature Flutter apps with significant adoption (≥500 GitHub stars) and a verifiable license.
query:
  stacks: [flutter]
  excludeStatuses: [archived, stale]
  minStars: 500
ranking:
  preset: quality
editorial:
  lastReviewedAt: "2026-08-11"
  selectionNote: |
    Stack is `flutter`. At least 500 GitHub stars. License is detected
    (i.e. not `NOASSERTION` / `OTHER`). Archived and stale records are
    excluded. Ranked by adoption (GitHub stars, log scale) multiplied by
    recent activity (releases, pushes and commits).
seo:
  index: true
  title: Top Open Source Flutter Apps in 2026
  description: The most adopted open-source Flutter apps with a verifiable license — production codebases with 500+ stars, ranked by adoption and recent activity.
